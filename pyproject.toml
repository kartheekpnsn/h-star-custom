[project]
name = "hstar"
version = "0.1.0"
description = "H-STAR: LLM-driven Hybrid SQL-Text Adaptive Reasoning on Tables"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "azure-identity>=1.25.2",
    "ipykernel>=7.2.0",
    "openai>=2.26.0",
    "openpyxl>=3.1.5",
    "pandas>=2.0.0",
    "pyclean>=3.5.0",
    "python-dotenv>=1.2.2",
    # Agent Framework (Challenge 02)
    "agent-framework==1.0.0rc2",
    "seaborn>=0.13.2",
    "scipy>=1.15.3",
]

[tool.uv]
prerelease = "allow"

[project.scripts]
hstar = "run_hstar:main"
